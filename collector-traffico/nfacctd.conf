! Collector di traffico: NetFlow/IPFIX esportato da switch e firewall (nfacctd, UDP 2055).
! Spento di serie: si accende con FLUSSI=netflow in /etc/collector-traffico/collector.env e rilanciando installa.sh.
! Stesso conteggio del mirror, stessa cartella: il prefisso del file dice la fonte.
daemonize: false
nfacctd_port: 2055
! I flussi campionati (1 pacchetto su N) si riportano al totale con il tasso dichiarato dall'apparato.
nfacctd_renormalize: true
aggregate: src_host, dst_host, proto, src_port, dst_port
plugins: print[coppie]
print_output[coppie]: json
print_output_file[coppie]: /var/lib/collector-traffico/in/netflow-%Y%m%d-%H%M%S.json
print_refresh_time[coppie]: 300
print_cache_entries[coppie]: 8191
files_umask: 022
plugin_buffer_size: 262144
plugin_pipe_size: 16777216
