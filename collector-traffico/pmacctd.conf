! Collector di traffico: conteggio dal mirror con pmacctd.
! La scheda arriva dalla riga di comando (-i $MIRROR_IF, vedi pmacctd-collector.service).
! Il servizio gira con TZ=UTC: l'ora nel nome del file è UTC.
daemonize: false
promisc: true
! Il mirror di un trunk porta il tag VLAN: senza «vlan» nel filtro i pacchetti con tag non si contano.
pcap_filter: ip or ip6 or (vlan and (ip or ip6))
aggregate: src_host, dst_host, proto, src_port, dst_port
plugins: print[coppie]
print_output[coppie]: json
print_output_file[coppie]: /var/lib/collector-traffico/in/%Y%m%d-%H%M%S.json
print_refresh_time[coppie]: 300
print_cache_entries[coppie]: 65537
files_umask: 022
plugin_buffer_size: 1048576
plugin_pipe_size: 67108864
