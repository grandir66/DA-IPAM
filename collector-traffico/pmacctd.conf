! Collector di traffico: conteggio dal mirror con pmacctd.
! La scheda arriva dalla riga di comando (-i $MIRROR_IF, vedi pmacctd-collector.service).
! Il servizio gira con TZ=UTC: l'ora nel nome del file è UTC.
daemonize: false
promisc: true
! Il mirror di un trunk porta il tag VLAN: senza «vlan» nel filtro i pacchetti con tag non si contano.
pcap_filter: ip or ip6 or (vlan and (ip or ip6))
aggregate: src_host, dst_host, proto, src_port, dst_port
plugins: print[coppie]
print_output[coppie]: json
! Il prefisso del nome dice la fonte (mirror, netflow, sflow): il collector la legge da lì.
print_output_file[coppie]: /var/lib/collector-traffico/in/mirror-%Y%m%d-%H%M%S.json
print_refresh_time[coppie]: 300
! Ogni voce della cache costa circa 4 KB di RAM subito, all'avvio: 65537 voci sono 265 MB e su 512 MB
! il kernel uccide pmacctd (visto sul banco il 20/11). Con 8191 sono circa 33 MB; se i flussi diversi in
! 5 minuti sono di più, pmacctd scrive un file in anticipo e il collector lo prende come un'altra finestra.
print_cache_entries[coppie]: 8191
files_umask: 022
plugin_buffer_size: 262144
plugin_pipe_size: 16777216
